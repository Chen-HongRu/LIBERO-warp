[pytest]
addopts = -ra
testpaths = tests
markers =
    static: Fast source-tree and package-data checks that do not construct MuJoCo environments.
    official_integration: Requires a local robosuite / MuJoCo rendering-capable installation; enable with LIBERO_RUN_OFFICIAL_INTEGRATION=1.
    nightly: Expensive validation, potentially including local demonstration replay; enable with LIBERO_RUN_NIGHTLY=1.
