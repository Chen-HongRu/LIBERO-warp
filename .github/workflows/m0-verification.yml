name: M0 official-backend verification

on:
  pull_request:
  push:
    branches:
      - master
      - 'codex/**'
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:
    inputs:
      qualification_suite:
        description: Optional scheduled qualification suite to run
        required: true
        default: g1
        type: choice
        options:
          - g1
          - legacy
          - full
          - all

env:
  PYTHONUNBUFFERED: '1'

jobs:
  static-and-package:
    name: Python 3.12 core/package smoke
    runs-on: ubuntu-latest
    env:
      MUJOCO_GL: osmesa
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Mesa software renderer
        run: sudo apt-get update && sudo apt-get install --yes libgl1-mesa-dri libosmesa6
      - name: Install locked development environment
        run: uv sync --locked --group dev
      - name: Check maintained M0 source and tests
        run: >-
          uvx ruff format --check
          libero/libero/envs/mujoco3_compat.py
          libero/libero/envs/env_wrapper.py
          libero/libero/envs/__init__.py
          libero/libero/envs/robots/__init__.py
          libero/libero/envs/robots/mounted_panda.py
          libero/libero/envs/robots/on_the_ground_panda.py
          libero/libero/benchmark/__init__.py
          libero/libero/utils/download_utils.py
          libero/libero/utils/utils.py
          libero/lifelong/_dependencies.py
          benchmark_scripts/__init__.py
          benchmark_scripts/download_libero_datasets.py
          benchmark_scripts/init_path.py
          scripts/collect_demonstration.py
          scripts/libero_100_collect_demonstrations.py
          scripts/create_dataset.py
          scripts/create_template.py
          scripts/config_copy.py
          scripts/generate_libero_api_manifest.py
          scripts/get_affordance_info.py
          scripts/__init__.py
          scripts/init_path.py
          tests
      - name: Lint maintained M0 source and tests
        run: >-
          uvx ruff check
          libero/libero/envs/mujoco3_compat.py
          libero/libero/envs/env_wrapper.py
          libero/libero/envs/__init__.py
          libero/libero/envs/robots/__init__.py
          libero/libero/envs/robots/mounted_panda.py
          libero/libero/envs/robots/on_the_ground_panda.py
          libero/libero/benchmark/__init__.py
          libero/libero/utils/download_utils.py
          libero/libero/utils/utils.py
          libero/lifelong/_dependencies.py
          benchmark_scripts/__init__.py
          benchmark_scripts/download_libero_datasets.py
          benchmark_scripts/init_path.py
          scripts/collect_demonstration.py
          scripts/libero_100_collect_demonstrations.py
          scripts/create_dataset.py
          scripts/create_template.py
          scripts/config_copy.py
          scripts/generate_libero_api_manifest.py
          scripts/get_affordance_info.py
          scripts/__init__.py
          scripts/init_path.py
          tests
      - name: Run static contracts
        run: >-
          uv run pytest -m static
          --ignore=tests/test_mjwarp_gpu_parity.py
          --ignore=tests/test_runtime_api.py
          --ignore=tests/test_task_compiler.py
          --ignore=tests/test_warp_spike_contract.py
          -q
      - name: Run real headless official golden
        run: >-
          LIBERO_RUN_OFFICIAL_INTEGRATION=1
          uv run pytest
          tests/test_g1_official_compatibility.py::test_real_default_backend_headless_state_and_step_golden
          -q
      - name: Require migration regressions to be real tests
        run: '! rg --fixed-strings xfail tests/test_migration_regressions.py tests/test_mujoco3_compatibility.py'
      - name: Import packaged console entrypoint
        shell: bash
        run: |
          config_dir="$RUNNER_TEMP/libero-config"
          mkdir -p "$config_dir"
          printf '%s\n' \
            "benchmark_root: $GITHUB_WORKSPACE/libero/libero" \
            "bddl_files: $GITHUB_WORKSPACE/libero/libero/bddl_files" \
            "init_states: $GITHUB_WORKSPACE/libero/libero/init_files" \
            "datasets: $RUNNER_TEMP/datasets" \
            "assets: $GITHUB_WORKSPACE/libero/libero/assets" \
            > "$config_dir/config.yaml"
          LIBERO_CONFIG_PATH="$config_dir" uv run python -c \
            'import scripts.create_template as entry; assert callable(entry.main)'

  official-pilot:
    name: Headless official pilot
    runs-on: ubuntu-latest
    needs: static-and-package
    env:
      MUJOCO_GL: osmesa
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Mesa software renderer
        run: sudo apt-get update && sudo apt-get install --yes libgl1-mesa-dri libosmesa6
      - name: Install locked development environment with downloader dependency
        run: uv sync --locked --extra huggingface --group dev
      - name: Run controller compatibility and official pilot
        run: >-
          LIBERO_RUN_OFFICIAL_INTEGRATION=1
          uv run pytest
          tests/test_mujoco3_compatibility.py
          tests/test_migration_regressions.py
          tests/test_packaging_contract.py
          tests/test_dataset_download_contract.py
          tests/test_g1_official_compatibility.py
          -q

  legacy-import-surface:
    name: Scheduled Python 3.12 legacy import surface
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
      (inputs.qualification_suite == 'legacy' ||
      inputs.qualification_suite == 'all'))
    runs-on: ubuntu-latest
    env:
      LIBERO_CONFIG_PATH: ${{ github.workspace }}/.ci-libero-config
      MUJOCO_GL: osmesa
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Mesa software renderer
        run: sudo apt-get update && sudo apt-get install --yes libgl1-mesa-dri libosmesa6
      - name: Configure non-interactive LIBERO paths
        shell: bash
        run: |
          mkdir -p "$LIBERO_CONFIG_PATH"
          printf '%s\n' \
            "benchmark_root: $GITHUB_WORKSPACE/libero/libero" \
            "bddl_files: $GITHUB_WORKSPACE/libero/libero/bddl_files" \
            "init_states: $GITHUB_WORKSPACE/libero/libero/init_files" \
            "datasets: $RUNNER_TEMP/datasets" \
            "assets: $GITHUB_WORKSPACE/libero/libero/assets" \
            > "$LIBERO_CONFIG_PATH/config.yaml"
      - name: Install locked legacy profile
        run: uv sync --locked --extra legacy --group dev
      - name: Import every frozen legacy module and CLI target
        run: |
          uv run --extra legacy python - <<'PY'
          import importlib
          import json
          from importlib.metadata import distribution

          manifest = json.load(open(
              "tests/api_manifest/upstream-8f1084e3132a39270c3a13ebe37270a43ece2a01.json"
          ))
          modules = sorted(
              name
              for name in manifest["target"]["modules"]
              if name == "libero.lifelong" or name.startswith("libero.lifelong.")
          )
          for module in modules:
              importlib.import_module(module)
          entrypoints = {
              entry.name: entry.value
              for entry in distribution("libero-warp").entry_points
              if entry.group == "console_scripts"
          }
          assert entrypoints["lifelong.eval"] == "libero.lifelong.evaluate:main"
          assert entrypoints["lifelong.main"] == "libero.lifelong.main:main"
          print(f"imported {len(modules)} frozen legacy modules")
          PY

  full-official-130:
    name: Scheduled full 130-task official backend
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
      (inputs.qualification_suite == 'full' ||
      inputs.qualification_suite == 'all'))
    runs-on: ubuntu-latest
    needs: static-and-package
    env:
      MUJOCO_GL: osmesa
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Mesa software renderer
        run: sudo apt-get update && sudo apt-get install --yes libgl1-mesa-dri libosmesa6
      - name: Install locked development environment
        run: uv sync --locked --extra tensor --group dev
      - name: Run all official tasks
        run: >-
          LIBERO_RUN_OFFICIAL_INTEGRATION=1
          uv run --extra tensor pytest -m official_integration
          --ignore=tests/test_mjwarp_gpu_parity.py
          --ignore=tests/test_warp_spike_contract.py
          -q

  public-demo-replay:
    name: Public demo replay
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
      (inputs.qualification_suite == 'full' ||
      inputs.qualification_suite == 'all'))
    runs-on: ubuntu-latest
    needs: full-official-130
    env:
      LIBERO_DEMO_ROOT: ${{ github.workspace }}/.libero-demo-cache
      MUJOCO_GL: osmesa
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Cache public demo
        uses: actions/cache@v4
        with:
          path: ${{ env.LIBERO_DEMO_ROOT }}
          key: libero-public-demo-kitchen-scene5-v1
      - name: Install locked development environment with public downloader
        run: uv sync --locked --extra huggingface --extra tensor --group dev
      - name: Download public successful demo
        shell: bash
        run: |
          uv run --extra huggingface python - <<'PY'
          import os
          from huggingface_hub import hf_hub_download

          hf_hub_download(
              repo_id="yifengzhu-hf/LIBERO-datasets",
              repo_type="dataset",
              filename="libero_90/KITCHEN_SCENE5_close_the_top_drawer_of_the_cabinet_demo.hdf5",
              local_dir=os.environ["LIBERO_DEMO_ROOT"],
          )
          PY
      - name: Install Mesa software renderer
        run: sudo apt-get update && sudo apt-get install --yes libgl1-mesa-dri libosmesa6
      - name: Replay complete public successful demonstration
        run: LIBERO_RUN_NIGHTLY=1 uv run pytest tests/test_official_backend_integration.py::test_local_demo_replay_hook -q
